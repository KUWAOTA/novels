                      - generic [ref=e1382]: 2011年 8月7日 額にしたたる汗越しに、青い空と入道雲を見つめてみようとする。 樹は目をぴくぴく動かして、汗で入道雲をゆらゆら動かしてみた。 ぶうんと目の前を横切ったハチに驚いてしまい、思わず目を閉じてしまう。 目を開けると、蜂はもういなかった。代わりに半透明の糸くずが、青空の上に浮いていた。 目だけを右に動かすと、透明な糸くずみたいな物も右へ滑った。急に止めると、少し遅れて下がってくる。 同じところを見つめていると、よくわからないけど、いつも現れる糸くずだ。 樹はそれを入道雲のてっぺんに載せようとした。けれど、糸くずを見ようとするたびに糸くずも逃げて、雲の輪郭を通り抜けた。 目をつむって太陽の方に顔を向けてみる。真っ暗なはずの閉じた視界に赤い筋が浮かび上がってくる。 クマゼミとアブラゼミが奏でる不協和音が音を遮ってくれる。 人の声すら聞かなくていい気がする。 だから、樹は夏休みが好きだった。 こういう瞬間だけは、自分のものにできたように感じた。 突然、母さんが樹にまたがり、肩を揺さぶる。 「あんた！はよ社会の勉強やるで」 社会と僕を隔てていた薄い膜が、破られてしまった。 「あんたの取り柄は勉強やねんから！」 「743年に制定された、田んぼを、ずっと、自分のものにしていいっていう法律は何。答えて、樹」 母・裕子<ゆうこ>が読み上げるあいだ、樹はしきりに消しゴムを頭上に投げている。 落ちてきた消しゴムを、キャラクター柄の下敷きで跳ね返す。 「じいっとしなさい！樹、最後のチャンスやで。ほら、さっきの。743年。田んぼのやつは何？」 用語だけ緑マーカーで塗られた手書きのプリントに、赤フィルムをかざしながら裕子が問う。 「墾田永年私財法でしょ。もう飽きた。なんでずっと同じことやらなきゃだめなの」 消しゴムを左手で受けながら樹は答える。 「その問題、さっきも正解したし。先生も、動きながらの方が覚えるって言ってたよ」 消しゴムをケースと中身に分解して、樹はケースと中身を交互に投げ始める。 ケースが畳に落ちた。 中身の白い方だけが、教科書の角で変な方向へ跳ねた。 裕子の頬に当たって、赤フィルムの上に落ちた。 赤フィルムが少しずれて、答えの赤字が半分だけ見えていた 「もうええわ」 裕子はプリントの端を握った。緑の線がしわで曲がった。 「お母さん、これ作るために五時に起きてんねんで」 「でも、これ教科書写しただけだよ。作る必要あった？」 樹は裕子の手の中の消しゴムに指を伸ばした。 裕子が離さないので、ケースだけが先に抜けた。 「じゃあ、いらんってこと？」 「そんなこと言ってないよ」 「せやったらこんなん、作らんかったらよかった」 裕子はごみ箱の上でくしゃくしゃにしたプリントを伸ばして、樹の前で細く裂いて見せた。 「なんで破るの。まだ使えるのに」 樹は、散り散りになったプリントを拾い集めた。 どれがどの順番かわからなかった。 それを鞄の奥に入れた。 「お父さんに電話する。明日の面会で、ちゃんと話してもらうから」 裕子はそう言って、リビングを出ていった。 廊下の奥で、部屋のドアが閉まった。
