                      - generic [ref=e1316]: 2012年8月8日 カーテンが揺れている。 天井から吊られたレースの白が、外から入る風で、ふくらんで、戻って、また少しふくらむ。 そのわずかな隙間から、眩しい空の青が現れては消える。 その光が、白すぎる病室の壁を少しだけやわらげていた。 反対側の壁には、レースの影だけが薄く残っていた。 きい、と鳴った。 少し遅れて、床がこつ、と鳴った。 きい。 こつ。 きい。 こつ。 カーテンの裾の下を、樹の靴先が横切った。 右足で床を蹴ると、丸い椅子は半分だけ回った。 もう一度蹴ると、白い壁と、窓と、カーテンと、ベッド、そして父さんの顔が樹の視界に順番に流れた。 父さんは樹に対して何も言わなかった。 「じっとしなさい」が口癖の母さんとは対照的に。 病院の簡素な椅子はよく回る。 ステンレスの丸い縁の、中に黒い合皮が敷かれただけの、安っぽい椅子なのだが、軽く蹴とばすだけでなかなかのスピードが出る。 母さんが樹に買った、本革の勉強用椅子よりもはるかに滑らかに。 樹は、早く回すことに夢中になっていた。 頬に当たる風が弱くなる前に、右足が次の床を探した。 床は、さっきと同じところに来なかった。 つま先が少し先へ出た。 椅子はまだ回っていた。 鞄が、一拍遅れて横に振れた。 樹の体が、椅子の外へ落ちた。 どん、と音がした。 父さんの指が、シーツを押した。 ベッドの上の体が、ほんの少しだけこちらへ傾いた。 樹は床に尻もちをついた。 鞄でずれて、肩紐が片方だけ肘のところまで落ちていた。 父さんは何も言わなかった。 樹の顔を見て、手を見て、膝を見た。 その目が一度止まって、それから戻ってきた。 シーツのしわが、父さんの指の下で少し戻った。 背中で、かたん、と鳴った。 鞄のふたが開いていた。 教科書の角が床に当たり、筆箱がその横へすべった。 赤い下敷きが、半分だけ口から出た。 その奥から、細い紙が落ちた。 一枚ではなかった。 緑の線が入った端。 赤い字が途中で切れた端。 くしゃくしゃのしわだけが残った、白い端。 樹は手を伸ばした。 <ここから先ガーっと書いているから、あんまり描写に力いれていない 後で、台詞とか描写とかその辺補強する> けれど、どれを先に拾えばいいのかわからなかった。 「その紙、どうしたの？」 やっと父さんは口を開いた。 「母さんが朝から頑張って作ってくれだんだ。なのに僕の目の前でやぶいたんだ」 父さんは微笑みを崩ず、小さく頷いて樹の話を聞いていた。 「別にこんなことまでしなくていいのに、時間の無駄じゃん」 「それは樹も困るなぁ」 顎髭を指で押さえながら、ゆっくりと父さんは話を切り出す。 「樹は、樹のペースで勉強したいもんなぁ」 「そう、そうなんだよ父さん。もはや、自分で勉強した方が早いんだよ。なんで母さんは効率が悪い方法を押し付けるの」
